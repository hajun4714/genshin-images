<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>원신 캐릭터 육성 가이드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Nanum+Myeongjo:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#12152e;--surface:#1b1f3f;--ink:#e8eaf8;--muted:#a3a9d0;--line:#32376a;
  --gold1:#f1c75a;--gold2:#a8731a;--violet1:#b58be6;--violet2:#5d3c97;
  --serif:"Nanum Myeongjo","Noto Serif KR",serif;
  color-scheme:dark;
}
*{box-sizing:border-box;caret-color:transparent}
.card,.card *{-webkit-user-select:none;user-select:none;-webkit-user-drag:none}
img{-webkit-user-drag:none}
html{background:var(--bg);scroll-behavior:auto}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.7;font-size:16px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
[hidden]{display:none!important}
@media (min-width:1280px){body{zoom:1.1}}
@media (min-width:1600px){body{zoom:1.15}}
@media (min-width:2200px){body{zoom:1.15}}
.wrap{max-width:900px;margin:0 auto;padding:0 20px}
header{padding:48px 0 24px}
h1{font-family:var(--serif);font-size:clamp(26px,6vw,38px);font-weight:800;letter-spacing:.06em;line-height:1.35;margin:0;color:var(--gold1);background:linear-gradient(90deg,#f6dc8a,#d9a93a 55%,#f6dc8a);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
header p{color:var(--muted);margin:14px 0 0;letter-spacing:.08em;font-size:14px}
header p::before{content:"";display:block;width:48px;height:2px;background:var(--gold2);margin-bottom:14px}
.grid{list-style:none;margin:0;padding:0 0 56px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{display:block;color:inherit;text-decoration:none;border-radius:12px;overflow:hidden;background:var(--surface);border:3px solid var(--line)}
button.card{width:100%;padding:0;font:inherit;text-align:inherit;-webkit-appearance:none;appearance:none}
a.card,button.card{cursor:pointer;transition:transform .15s}
a.card:hover,button.card:hover{transform:translateY(-3px)}
a.card:focus-visible,button.card:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.toast{position:fixed;left:50%;top:50%;z-index:20;transform:translate(-50%,-50%);padding:16px 30px;border:2px solid var(--gold1);border-radius:14px;background:rgba(27,31,63,.96);color:var(--gold1);font-family:var(--serif);font-weight:800;font-size:18px;letter-spacing:.08em;box-shadow:0 10px 30px rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.r5{border-color:var(--gold1)}
.r4{border-color:var(--violet1)}
.photo{position:relative;aspect-ratio:1/1;background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph{font-family:var(--serif);font-weight:800;font-size:64px;color:rgba(255,255,255,.35)}
.stars{position:absolute;left:0;right:0;bottom:0;padding:4px 8px;font-size:15px;letter-spacing:3px;color:var(--gold1);text-shadow:0 1px 3px rgba(0,0,0,.8);background:linear-gradient(transparent,rgba(0,0,0,.6))}
.r4 .stars{color:var(--violet1)}
.name{padding:12px 12px 14px;font-family:var(--serif);font-weight:800;font-size:17px;letter-spacing:.1em;text-align:center}
/* detail */
.detail{max-width:760px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 20px) 20px 64px}
.back{display:inline-flex;align-items:center;min-height:44px;color:var(--muted);text-decoration:none;font-size:15px}
.back:hover{color:var(--ink)}
.back:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.art{margin:8px 0 0;border:3px solid var(--gold1);border-radius:14px;overflow:hidden;background:#fff}
.art img{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover}
/* weapons */
.wsec{margin-top:40px}
.whead{display:flex;align-items:center;gap:14px;margin:0 0 16px;padding-bottom:12px;border-bottom:1px solid var(--gold2)}
.wsec h3{font-family:var(--serif);font-weight:800;font-size:22px;letter-spacing:.1em;color:var(--gold1);margin:0}
.gbtn{font:inherit;font-size:14px;font-weight:700;min-height:40px;padding:4px 16px;border-radius:999px;border:2px solid var(--gold2);background:transparent;color:var(--gold1);cursor:pointer}
.gbtn[aria-pressed="true"]{background:var(--gold1);border-color:var(--gold1);color:#12152e}
.gbtn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.wref{padding:0 8px;text-align:center;font-size:12px;color:var(--muted)}
.wgraph{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.grow{display:grid;grid-template-columns:44px minmax(84px,128px) 1fr 54px;gap:12px;align-items:center;animation:rise .4s calc(var(--i)*.08s) both}
.gicon{width:44px;height:44px;border:2px solid var(--line);border-radius:8px;background:#fff;overflow:hidden}
.gicon.r5{border-color:var(--gold1)}
.gicon.r4{border-color:var(--violet1)}
.gicon img{display:block;width:100%;height:100%;object-fit:contain}
.glabel{line-height:1.3}
.glabel b{display:block;font-family:var(--serif);font-weight:800;font-size:15px;letter-spacing:.04em}
.glabel small{color:var(--muted);font-size:12px}
.track{height:26px;border-radius:6px;background:rgba(255,255,255,.07);overflow:hidden}
.bar{height:100%;width:var(--w);border-radius:6px;background:#5b9bd5;transform-origin:left;animation:grow .85s calc(var(--i)*.08s + .1s) cubic-bezier(.2,.7,.2,1) both}
.bar.top{background:var(--gold1)}
.pct{text-align:right;font-weight:700;font-size:15px}
.pct.top{color:var(--gold1)}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){.grow,.bar{animation:none!important}}
.wgrid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.wcard{position:relative;border:3px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.wcard.r5{border-color:var(--gold1)}
.wcard.r4{border-color:var(--violet1)}
.wimg{aspect-ratio:1/1;background:#fff}
.wimg img{display:block;width:100%;height:100%;object-fit:contain}
.rank{position:absolute;left:8px;top:8px;padding:1px 10px;border-radius:999px;background:rgba(18,21,46,.88);color:var(--gold1);font-size:13px;font-weight:700;letter-spacing:.04em}
.wname{padding:10px 8px 2px;font-family:var(--serif);font-weight:800;font-size:16px;letter-spacing:.06em;text-align:center}
.wstars{padding:0 8px 10px;text-align:center;font-size:13px;letter-spacing:3px;color:var(--gold1)}
.wcard.r4 .wstars{color:var(--violet1)}
.enter .wsec{animation:rise .55s .75s both}
/* artifacts */
.asec{margin-top:40px}
.alist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.acard{position:relative;display:grid;grid-template-columns:112px minmax(0,1fr);grid-template-areas:"img text";gap:18px;align-items:start;padding:14px;border:3px solid var(--line);border-radius:12px;background:var(--surface)}
.acard.r5{border-color:var(--gold1)}
.acard.r4{border-color:var(--violet1)}
.acard.has-g{grid-template-columns:112px minmax(0,1fr) 200px;grid-template-areas:"img text graph"}
.aimg{grid-area:img;position:relative;aspect-ratio:1/1;border-radius:8px;background:#fff;overflow:hidden}
.aimg img{display:block;width:100%;height:100%;object-fit:contain}
.aimg .rank{left:6px;top:6px;font-size:12px;padding:0 8px}
.atext{grid-area:text;min-width:0}
.agraph{grid-area:graph;align-self:center;display:grid;grid-template-columns:minmax(0,1fr) 54px;gap:10px;align-items:center}
.agraph .bar{animation-delay:calc(var(--i)*.08s + .9s)}
.aname{margin:2px 0 10px;font-family:var(--serif);font-weight:800;font-size:19px;letter-spacing:.06em;color:var(--ink)}
.aset{margin:0}
.aset dt{font-size:13px;font-weight:700;color:var(--violet1);letter-spacing:.04em}
.aset dd{margin:2px 0 12px;font-size:15px;line-height:1.75;color:var(--ink);word-break:keep-all}
.aset dd:last-child{margin-bottom:0}
@media (max-width:620px){.acard,.acard.has-g{grid-template-columns:96px minmax(0,1fr);grid-template-areas:"img graph" "text text";gap:12px 16px}.acard:not(.has-g){grid-template-areas:"img ." "text text"}}
.enter .asec{animation:rise .55s .85s both}
/* main stats */
.msec{margin-top:40px}
.mlist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.mcard{padding:16px 12px;border:2px solid var(--line);border-radius:12px;background:var(--surface);text-align:center}
.mimg{width:84px;max-width:100%;aspect-ratio:1/1;margin:0 auto 10px;border-radius:10px;background:#fff;overflow:hidden}
.mimg img{display:block;width:100%;height:100%;object-fit:contain}
.mslot{font-size:13px;font-weight:700;color:var(--violet1);letter-spacing:.06em}
.mval{margin-top:4px;font-family:var(--serif);font-weight:800;font-size:17px;letter-spacing:.04em;color:var(--gold1);word-break:keep-all}
@media (max-width:420px){.mlist{gap:8px}.mcard{padding:12px 6px}.mimg{width:72px}.mval{font-size:15px}}
.enter .msec{animation:rise .55s .95s both}
/* stat targets */
.ssec{margin-top:40px}
.slist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.scard{padding:14px 12px;border:2px solid var(--line);border-radius:12px;background:var(--surface);text-align:center}
.sname{font-size:14px;font-weight:700;color:var(--ink);letter-spacing:.04em}
.srow{display:flex;justify-content:space-between;align-items:baseline;gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.srow span{font-size:12px;color:var(--muted)}
.srow b{font-family:var(--serif);font-weight:800;font-size:17px;color:var(--ink)}
.srow.rec b{color:var(--gold1)}
.note{margin:12px 2px 0;font-size:13px;color:var(--muted);line-height:1.6;word-break:keep-all}
@media (max-width:620px){.slist{grid-template-columns:repeat(2,1fr);gap:10px}}
/* talents */
.tsec{margin-top:40px}
.tlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.tcard{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--surface)}
.tcard.top{border-color:var(--gold1)}
.ticon{width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#4a3f86,#241f4b);border:2px solid var(--violet2);display:flex;align-items:center;justify-content:center}
.ticon img{width:80%;height:80%;object-fit:contain}
.ttype{font-size:12px;font-weight:700;color:var(--violet1);letter-spacing:.04em}
.tname{font-family:var(--serif);font-weight:800;font-size:17px;letter-spacing:.04em;margin:1px 0 2px}
.tdesc{font-size:14px;line-height:1.65;color:var(--muted);word-break:keep-all}
.tpri{align-self:start;padding:2px 12px;border-radius:999px;background:rgba(18,21,46,.88);border:1px solid var(--gold2);color:var(--gold1);font-size:13px;font-weight:700;white-space:nowrap}
.tsub{margin:22px 0 10px;font-family:var(--serif);font-weight:800;font-size:17px;letter-spacing:.08em;color:var(--ink)}
.plist .tcard{grid-template-columns:48px minmax(0,1fr)}
.plist .ticon{width:48px;height:48px}
@media (max-width:420px){.tcard{grid-template-columns:44px minmax(0,1fr) auto;gap:10px;padding:12px}.ticon,.plist .ticon{width:44px;height:44px}.plist .tcard{grid-template-columns:44px minmax(0,1fr)}.tpri{padding:2px 8px;font-size:12px}}
/* teams */
.psec{margin-top:40px}
.plist2{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.pcard{padding:14px;border:2px solid var(--line);border-radius:12px;background:var(--surface)}
.pcard.top{border-color:var(--gold1)}
.phead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pname{font-family:var(--serif);font-weight:800;font-size:18px;letter-spacing:.04em}
.ptag{padding:1px 10px;border-radius:999px;border:1px solid var(--violet1);color:var(--violet1);font-size:12px;font-weight:700}
.pmem{list-style:none;margin:12px 0 0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pmem li{text-align:center}
.pava{aspect-ratio:1/1;border-radius:10px;overflow:hidden;background:linear-gradient(160deg,#6a4b2c,#a8731a);border:2px solid var(--line)}
.pava.r4{background:linear-gradient(160deg,#4a3a7a,#8a63c8)}
.pava img{display:block;width:100%;height:100%;object-fit:cover}
.pava.me{border-color:var(--gold1)}
.pmem small{display:block;margin-top:4px;font-size:13px;font-weight:700;color:var(--ink)}
.pmem em{display:block;font-style:normal;font-size:11px;color:var(--muted)}
.pdesc{margin:10px 0 0;font-size:14px;line-height:1.65;color:var(--muted);word-break:keep-all}
.enter .ssec{animation:rise .55s 1.05s both}
.enter .tsec{animation:rise .55s 1.15s both}
.enter .psec{animation:rise .55s 1.25s both}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes zoom{from{transform:scale(1.08)}to{transform:scale(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.art{overflow:hidden}
.enter .back{animation:rise .4s both}
.enter .art{animation:rise .65s .05s cubic-bezier(.2,.7,.2,1) both}
.enter .art img{animation:zoom 1.1s .05s cubic-bezier(.2,.7,.2,1) both}
.enter h2{animation:rise .55s .35s both}
.enter .dstars{animation:rise .55s .45s both}
.enter .info div:nth-child(1){animation:rise .55s .55s both}
.enter .info div:nth-child(2){animation:rise .55s .65s both}
.back-enter{animation:fade .4s both}
@media (prefers-reduced-motion:reduce){.enter *,.back-enter{animation:none!important}}
.detail h2{font-family:var(--serif);font-weight:800;font-size:clamp(28px,7vw,38px);letter-spacing:.1em;margin:28px 0 0;color:var(--gold1)}
.dstars{font-size:18px;letter-spacing:4px;color:var(--gold1);margin-top:2px}
.info{margin:22px 0 0;border-top:1px solid var(--gold2)}
.info div{display:flex;gap:16px;padding:14px 4px;border-bottom:1px solid var(--line)}
.info dt{flex:0 0 96px;color:var(--muted);font-size:15px}
.info dd{margin:0;font-weight:700;font-size:17px}
</style>
</head>
<body>
<main class="wrap" id="listview">
<header>
  <h1>어떤 캐릭터를 육성하고 싶으세요?</h1>
  <p>캐릭터 목록입니다.</p>
</header>
<ul class="grid" id="grid"></ul>
</main>

<main class="detail" id="detailview" hidden>
  <a class="back" href="#">← 캐릭터 목록</a>
  <figure class="art"><img id="dart" alt=""></figure>
  <h2 id="dname"></h2>
  <div class="dstars" id="dstars" role="img"></div>
  <dl class="info" id="dinfo"></dl>
  <section class="wsec" id="wsec"><div class="whead"><h3>추천 무기</h3><button type="button" class="gbtn" id="gbtn" aria-pressed="false">그래프</button></div><ol class="wgrid" id="wgrid"></ol><ol class="wgraph" id="wgraph" hidden></ol></section>
  <section class="wsec asec" id="asec"><div class="whead"><h3>추천 성유물</h3></div><ol class="alist" id="alist"></ol></section>
  <section class="wsec msec" id="msec"><div class="whead"><h3>주옵션</h3></div><ul class="mlist" id="mlist"></ul></section>
  <section class="wsec ssec" id="ssec"><div class="whead"><h3>권장 스펙</h3></div><ul class="slist" id="slist"></ul><p class="note" id="snote"></p></section>
  <section class="wsec tsec" id="tsec"><div class="whead"><h3>특성</h3></div><ol class="tlist" id="tlist"></ol><p class="note" id="tnote"></p><div id="pwrap"><h4 class="tsub">고유 특성</h4><ul class="tlist plist" id="plist"></ul></div></section>
  <section class="wsec psec" id="psec"><div class="whead"><h3>파티 편성</h3></div><ol class="plist2" id="tmlist"></ol></section>
</main>

      var ws=cur.weapons,mx=Math.max.apply(null,ws.map(function(w){return w.p}));

      }).join("");
